name: Generate and commit public HTML

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate static HTML
        run: |
          python3 scripts/build_site.py
          python3 scripts/validate_site.py

      - name: Commit public directory if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/
          if git diff --cached --quiet; then
            echo 'public/ is already up to date; no commit required.'
            exit 0
          fi
          git commit -m 'chore: regenerate static HTML in public'
          git push origin HEAD:main
